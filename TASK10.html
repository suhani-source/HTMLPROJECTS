
<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>
<body>

    <h1 align="center">Online Course Registration</h1>

    <h2>Student Registration Form</h2>

    <form action="#" target="_blank" method="post">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Student Name:</label>
            <input type="text" id="name" name="student_name"
                   placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
            <br><br>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile"
                   placeholder="Enter mobile number" required>
            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age"
                   min="16" max="60">
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Create password" required>
            <br><br>
        </fieldset>

        <br>

        <!-- Gender -->
        <fieldset>
            <legend>Gender</legend>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </fieldset>

        <br>

        <!-- Skills -->
        <fieldset>
            <legend>Technical Skills</legend>

            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>
            <br>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>
            <br>

            <input type="checkbox" id="javascript" name="skills" value="JavaScript">
            <label for="javascript">JavaScript</label>
            <br>

            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label>
        </fieldset>

        <br>

        <!-- Course Preferences -->
        <fieldset>
            <legend>Course Preferences</legend>

            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="">--Select Course--</option>
                <option value="web">Web Development</option>
                <option value="python">Python Programming</option>
                <option value="ai">Artificial Intelligence</option>
                <option value="ml">Machine Learning</option>
            </select>
            <br><br>

            <label for="mode">Learning Mode:</label>
            <select id="mode" name="mode">
                <option value="">--Select Mode--</option>
                <option value="online">Online</option>
                <option value="offline">Offline</option>
            </select>
        </fieldset>

        <br>

        <!-- Additional Details -->
        <fieldset>
            <legend>Additional Details</legend>

            <label for="address">Address:</label>
            <br>
            <textarea id="address" name="address"
                      rows="4" cols="40"
                      placeholder="Enter your address"></textarea>
            <br><br>

            <label for="joining">Preferred Joining Date:</label>
            <input type="date" id="joining" name="joining">
            <br><br>

            <label for="document">Upload Supporting Document:</label>
            <input type="file" id="document" name="document">
        </fieldset>

        <br>

        <input type="submit" value="Register Now">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
