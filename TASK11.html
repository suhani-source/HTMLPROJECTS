
<!DOCTYPE html>
<html>
<head>
    <title>Readers' Haven – Book Registration & Order Form</title>
</head>
<body>

    <h1 align="center">Readers' Haven</h1>
    <h2 align="center">Book Registration & Order Form</h2>

    <form action="#" target="_blank" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend><b>Customer Personal Information</b></legend>

            <label for="name">Customer Name:</label>
            <input type="text" id="name" name="customer_name"
                   placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email address" required>
            <br><br>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile"
                   placeholder="Enter your mobile number" required>
            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="10" max="100">
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Create your password" required>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Book Preferences & Order Details</b></legend>

            <label for="category">Favorite Book Category:</label>
            <select id="category" name="category" required>
                <option value="">-- Select Category --</option>
                <option value="Fiction">Fiction</option>
                <option value="Science">Science</option>
                <option value="History">History</option>
                <option value="Children">Children's Books</option>
            </select>
            <br><br>

            <label for="book">Book Title:</label>
            <input type="text" id="book" name="book_title"
                   placeholder="Enter book title" required>
            <br><br>

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity"
                   min="1" value="1" required>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Payment Details</b></legend>

            <p>Preferred Payment Method:</p>

            <input type="radio" id="cod" name="payment" value="COD" required>
            <label for="cod">Cash on Delivery</label>
            <br>

            <input type="radio" id="online" name="payment" value="Online">
            <label for="online">Online Payment</label>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Additional Services</b></legend>

            <input type="checkbox" id="gift" name="services" value="Gift Wrapping">
            <label for="gift">Gift Wrapping</label>
            <br>

            <input type="checkbox" id="bookmark" name="services" value="Bookmark">
            <label for="bookmark">Bookmark</label>
            <br>

            <input type="checkbox" id="express" name="services" value="Express Delivery">
            <label for="express">Express Delivery</label>
            <br>

            <input type="checkbox" id="card" name="services" value="Greeting Card">
            <label for="card">Greeting Card</label>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Delivery Information</b></legend>

            <label for="date">Delivery Date:</label>
            <input type="date" id="date" name="delivery_date">
            <br><br>

            <label for="time">Preferred Delivery Time:</label>
            <input type="time" id="time" name="delivery_time">
            <br><br>

            <label for="address">Delivery Address:</label>
            <br>
            <textarea id="address" name="address" rows="4" cols="40"
                      placeholder="Enter your complete delivery address" required></textarea>
            <br><br>

            <label for="instructions">Special Instructions:</label>
            <br>
            <textarea id="instructions" name="instructions" rows="4" cols="40"
                      placeholder="Enter any special delivery instructions"></textarea>
        </fieldset>

        <br>

        <fieldset>
            <legend><b>Supporting Document</b></legend>

            <label for="document">Upload Reference Image/Document:</label>
            <input type="file" id="document" name="document"
                   accept="image/*,.pdf">
        </fieldset>

        <br>

        <input type="hidden" name="form_type"
               value="Readers Haven Book Order">

        <button type="submit">Submit Order</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
